# config.yaml: every NON-SECRET setting, in one place
paths:
  raw_data: "data/raw/customers.csv"
  report: "reports/metrics.json"
  log_file: "logs/pipeline.log"

data:
  required_columns: ["customer_id", "usage_hours", "churned"]
  feature: "usage_hours"
  target: "churned"

model:
  usage_threshold: 10.0  # churn below this many hours

quality_gate:
  metric: "accuracy"
  min_value: 0.80

logging:
  level: "INFO"
